name: Build Tweak

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-12
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Setup Theos
        uses: roothide/setup-theos@v1
        with:
          theos-src: https://github.com/theos/theos.git

      - name: Build Tweak
        run: |
          make package FINALPACKAGE=1
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ForceBypass-Tweak
          path: packages/*.deb
